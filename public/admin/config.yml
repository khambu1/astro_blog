backend:
  name: turbo-github
  turbo_site_id: 50bdf7ac-9a24-4af6-ab71-bad38a1b2f88
  branch: main

media_folder: "src/assets/blog"
public_folder: "/src/assets/blog"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Publish Date"
        name: "pubDate"
        widget: "datetime"
        format: "YYYY-MM-DD"

      - label: "Author"
        name: "author"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "string"

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Body"
        name: "body"
        widget: "markdown"